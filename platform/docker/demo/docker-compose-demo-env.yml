networks:
  jason-lab-net:
    external: true
    name: jason-lab-net

# 共通ロギング設定（コンテナログの肥大化防止: 最大20MB x 3世代 = 60MB）
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:

