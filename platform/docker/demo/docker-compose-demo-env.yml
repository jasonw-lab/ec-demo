  # MySQL for ec-demo
  ec-demo-mysql:
    <<: *default-logging
    image: mysql:8.0.29
    # platform: ${EC_DEMO_PLATFORM:-linux/amd64}
    container_name: ec-demo-mysql-8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Tokyo
      LANG: en_US.UTF-8
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - ./sql/mysql-init:/docker-entrypoint-initdb.d
      - ${BASEPATH}/mysql/conf/my.cnf:/etc/my.cnf
      - ${BASEPATH}/mysql/data:/var/lib/mysql
      - ${BASEPATH}/mysql/log:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - jason-lab-net

  # Seata Server for ec-demo
  ec-demo-seata-server:
    <<: *default-logging
    image: seataio/seata-server:2.0.0
    # platform: ${EC_DEMO_PLATFORM:-linux/amd64}
    container_name: ec-demo-seata-server-2.0
    ports:
      - "7092:7091"   # console
      - "8091:8091"   # seata server
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - STORE_MODE=db
      - SEATA_IP=ec-demo-seata-server
      - SEATA_PORT=8091
    volumes:
      - ${BASEPATH}/seata/conf/application.yml:/seata-server/resources/application.yml:ro
      - ${BASEPATH}/seata/logs:/root/logs/seata
    restart: unless-stopped
    networks:
      - jason-lab-net
    depends_on:
      ec-demo-mysql:
        condition: service_healthy

  # ==========================================
  # Apache Kafka (KRaft mode, Confluent 7.7.1 商用安定版)
  # ==========================================
  ec-demo-kafka:
    <<: *default-logging
    image: confluentinc/cp-kafka:7.7.1
    container_name: ec-demo-kafka
    ports:
      - "29092:29092"
    environment:
      # KRaft mode settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ec-demo-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Listeners configuration
      # PLAINTEXT: コンテナ間通信用 (ec-demo-kafka:9092)
      # PLAINTEXT_HOST: ホストからのアクセス用 (HOST_IP環境変数でカスタマイズ可能、デフォルト: localhost)
      KAFKA_LISTENERS: PLAINTEXT://ec-demo-kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://ec-demo-kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ec-demo-kafka:9092,PLAINTEXT_HOST://${HOST_IP:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # JVM Memory / Heap settings (OOM防止 & リソース安定化)
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

      # Topic configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "ec-demo.orders.events.v1:1:1"

      # Log Retention settings (ディスク容量枯渇対策: 7日保持)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - ec-demo-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready 1 5 -b localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - jason-lab-net

  # ==========================================
  # Kafka UI (Webコンソール, v0.7.2 安定版)
  # ==========================================
  ec-demo-kafka-ui:
    <<: *default-logging
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ec-demo-kafka-ui
    depends_on:
      ec-demo-kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ec-demo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ec-demo-kafka:9092
    restart: unless-stopped
    networks:
      - jason-lab-net

